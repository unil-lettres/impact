name: docker-stage
on:
  schedule:
    - cron: '0 1 * * 1' # Every Monday at 1am
      timezone: "Europe/Zurich"
  push:
    branches:
      - "development"
permissions: read-all

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { service: app, arch: linux/amd64, os: ubuntu-latest }
          - { service: app, arch: linux/arm64, os: ubuntu-26.04-arm }
          - { service: worker, arch: linux/amd64, os: ubuntu-latest }
          - { service: worker, arch: linux/arm64, os: ubuntu-26.04-arm }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Build image
        uses: unil-lettres/actions/docker-build@main
        with:
          dockerfile: ./docker/${{ matrix.service }}.dockerfile
          target: prod
          platform: ${{ matrix.arch }}
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          name_prefix: ${{ matrix.service }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  merge-app:
    name: Merge app
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      tag: ${{ steps.merge.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Merge service
        id: merge
        uses: unil-lettres/actions/docker-merge-stage@main
        with:
          service: app
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  merge-worker:
    name: Merge worker
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      tag: ${{ steps.merge.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Merge service
        id: merge
        uses: unil-lettres/actions/docker-merge-stage@main
        with:
          service: worker
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  commit:
    name: Commit Image Tags
    runs-on: ubuntu-latest
    needs: [merge-app, merge-worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Find apache-shibboleth latest DockerHub tag
        id: find_shib_tag
        continue-on-error: true
        uses: unil-lettres/actions/latest-tag@main
        with:
          image_repository: ${{ vars.DOCKERHUB_SHIB_REPOSITORY }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare commit values
        run: |
          if [[ "${{ steps.find_shib_tag.outcome }}" == "success" ]]; then
            echo "VERSIONS=${{ needs.merge-app.outputs.tag }},${{ needs.merge-worker.outputs.tag }},${{ steps.find_shib_tag.outputs.tag }}" >> $GITHUB_ENV
            echo "VERSION_KEYS=app_image_tag,worker_image_tag,shib_image_tag" >> $GITHUB_ENV
          else
            echo "VERSIONS=${{ needs.merge-app.outputs.tag }},${{ needs.merge-worker.outputs.tag }}" >> $GITHUB_ENV
            echo "VERSION_KEYS=app_image_tag,worker_image_tag" >> $GITHUB_ENV
          fi

      - name: Update image
        uses: unil-lettres/actions/commit-version@main
        with:
          file_path: impact/values-stage.yaml
          versions: "${{ env.VERSIONS }}"
          version_keys: "${{ env.VERSION_KEYS }}"
          token: ${{ secrets.PAT_TOKEN }}
          repository: unil-lettres/k8s
          branch: main

  update-description:
    name: Update Description
    runs-on: ubuntu-latest
    needs: [merge-app, merge-worker]
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Update description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
