name: ci
on: [push, pull_request]
permissions: read-all
env:
  MAIL_HOST: ${{ secrets.MAIL_HOST }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  CI: gha
  CHROME_MAJOR_VERSION: '133'

jobs:
  test:
    name: PHP${{ matrix.php-versions }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-versions: [ '8.5' ]
        composer-version: [ '2.8' ]
        mariadb-version: [ '11.4' ]
        node-version: [ '22' ]

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: impact
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node Setup
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
          tools: composer:${{ matrix.composer-version }}

      - name: Show PHP version
        run: php -v

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Build app
        id: app-build
        working-directory: ./site
        run: ./ci-setup.sh

      - name: Check PHP code style
        id: app-php-style
        working-directory: ./site
        run: ./vendor/bin/pint --test -v
        continue-on-error: true

      - name: Install Chrome
        run: |
          # Remove pre-installed Chrome to avoid version conflicts with ChromeDriver
          sudo apt-get remove -y google-chrome-stable || true
          sudo rm -f /usr/bin/google-chrome /usr/bin/chromium-browser
          # Fetch the latest available build for the specified major version
          CHROME_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          versions = [v for v in data['versions'] if v['version'].startswith('${{ env.CHROME_MAJOR_VERSION }}.')]
          print(versions[-1]['version'])
          ")
          echo "Installing Chrome version: $CHROME_VERSION"
          # Download and install Chrome
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
          unzip -q chrome-linux64.zip -d /opt/chrome-${{ env.CHROME_MAJOR_VERSION }}
          sudo ln -sf /opt/chrome-${{ env.CHROME_MAJOR_VERSION }}/chrome-linux64/chrome /usr/local/bin/google-chrome
          # Download and install ChromeDriver
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q chromedriver-linux64.zip -d /opt/chrome-${{ env.CHROME_MAJOR_VERSION }}
          sudo ln -sf /opt/chrome-${{ env.CHROME_MAJOR_VERSION }}/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          # Verify the installed versions
          google-chrome --version
          chromedriver --version

      - name: Start Chrome driver
        run: chromedriver --port=9515 &

      - name: Run Laravel server
        working-directory: ./site
        run: php artisan serve --no-reload &

      - name: Execute browser tests
        id: app-test-browser
        working-directory: ./site
        run: php artisan dusk

      - name: Execute unit/feature tests
        id: app-test-unit
        working-directory: ./site
        run: php artisan test

      - name: Screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-failed-tests-${{ matrix.php-versions }}
          path: site/tests/Browser/screenshots

      - name: Logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-failed-tests-${{ matrix.php-versions }}
          path: site/storage/logs
